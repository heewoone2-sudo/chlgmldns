    <script>
      // Fix for "Cannot set property fetch of #<Window> which has only a getter"
      // Ensures window.fetch has both a getter and a setter so runtime monitoring scripts can safely proxy fetch
      (function() {
        try {
          var originalFetch = window.fetch;
          var currentFetch = typeof originalFetch === 'function' ? originalFetch.bind(window) : originalFetch;
          
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(newFetch) {
              currentFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              var protoFetch = Window.prototype.fetch;
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() {
                  return protoFetch;
                },
                set: function(newFetch) {
                  protoFetch = newFetch;
                },
                configurable: true,
                enumerable: true
              });
            }
          } catch (err) {
            // ignore
          }
        }
      })();
    </script>
